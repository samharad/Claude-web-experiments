<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotatable Dial</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .loading {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="loading">Redirecting...</div>
    <script>
        // Get angle from query parameter
        const params = new URLSearchParams(window.location.search);
        let angle = parseInt(params.get('angle')) || 0;

        // Constrain angle to valid range
        if (angle < -90) angle = -90;
        if (angle > 90) angle = 90;

        // Generate filename
        const angleStr = angle < 0 ? `minus${Math.abs(angle)}` : angle.toString();
        const filename = `dial-${angleStr}.html`;

        // Redirect to the appropriate dial file
        window.location.href = `dial/${filename}`;
    </script>
</body>
</html>
