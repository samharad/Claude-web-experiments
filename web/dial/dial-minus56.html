<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotatable Dial - -56°</title>

    <!-- Open Graph meta tags for link previews -->
    <meta property="og:title" content="Rotatable Dial - -56°">
    <meta property="og:description" content="Interactive rotatable dial set to -56 degrees">
    <meta property="og:image" content="https://tools.samadams.dev/dial/previews/dial-minus56.png">
    <meta property="og:url" content="https://tools.samadams.dev/dial/dial-minus56.html">
    <meta property="og:type" content="website">

    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Rotatable Dial - -56°">
    <meta name="twitter:description" content="Interactive rotatable dial set to -56 degrees">
    <meta name="twitter:image" content="https://tools.samadams.dev/dial/previews/dial-minus56.png">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            gap: 20px;
        }

        #dial-container {
            cursor: pointer;
            user-select: none;
        }

        #share-button {
            padding: 10px 20px;
            background-color: #ffffff;
            color: #1a1a1a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        @media (hover: hover) {
            #share-button:hover {
                background-color: #e0e0e0;
            }
        }

        #copy-message {
            position: absolute;
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            border-radius: 5px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            margin-top: 10px;
            white-space: nowrap;
        }

        #copy-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <svg id="dial-container" width="400" height="213" viewBox="40 40 320 170">
        <!-- Dial base semicircle -->
        <path d="M 50 200 A 150 150 0 0 1 350 200 Z" fill="#ffffff" stroke="#cccccc" stroke-width="3"/>

        <!-- Center dot -->
        <circle cx="200" cy="200" r="10" fill="#660000"/>

        <!-- Dial arm -->
        <line id="dial-arm" x1="200" y1="200" x2="200" y2="50" stroke="#ff0000" stroke-width="8" stroke-linecap="round"/>
    </svg>

    <div style="position: relative;">
        <button id="share-button">Share</button>
        <div id="copy-message">Link copied!</div>
    </div>

    <script>
        const dialArm = document.getElementById('dial-arm');
        const dialContainer = document.getElementById('dial-container');
        const centerX = 200;
        const centerY = 200;
        let isDragging = false;
        let currentAngle = -56; // Initialize to this file's angle

        // Get the filename for a given angle
        function getFilenameForAngle(angle) {
            const angleStr = angle < 0 ? `minus${Math.abs(angle)}` : angle.toString();
            return `dial-${angleStr}.html`;
        }

        // Update dial arm position
        function updateDialArm(angle) {
            // Convert angle to radians (-90 = left, 0 = up, 90 = right)
            // Subtract 90 to convert from our system (0 = up) to math coordinates (0 = right)
            const radians = (angle - 90) * Math.PI / 180;
            const armLength = 150;
            const endX = centerX + armLength * Math.cos(radians);
            const endY = centerY + armLength * Math.sin(radians);

            dialArm.setAttribute('x2', endX);
            dialArm.setAttribute('y2', endY);
            currentAngle = angle;
        }

        // Calculate angle from mouse position
        function calculateAngle(clientX, clientY) {
            const rect = dialContainer.getBoundingClientRect();
            const viewBoxWidth = 320;
            const viewBoxHeight = 170;
            const viewBoxX = 40;
            const viewBoxY = 40;
            const scaleX = viewBoxWidth / rect.width;
            const scaleY = viewBoxHeight / rect.height;

            const x = (clientX - rect.left) * scaleX + viewBoxX - centerX;
            const y = (clientY - rect.top) * scaleY + viewBoxY - centerY;

            // Calculate angle in degrees (0 = right, counterclockwise)
            let angle = Math.atan2(y, x) * 180 / Math.PI;

            // Convert to our coordinate system (0 = up, clockwise)
            angle = angle + 90;

            // Normalize to -180 to 180 range
            if (angle > 180) angle -= 360;

            // Constrain to -90 to 90 degrees
            if (angle < -90) angle = -90;
            if (angle > 90) angle = 90;

            return Math.round(angle);
        }

        // Navigate to the appropriate dial file for the current angle
        function navigateToAngle(angle) {
            if (angle === -56) return; // Already on this page
            const filename = getFilenameForAngle(angle);
            window.location.href = filename;
        }

        // Mouse event handlers
        function startDragging(e) {
            isDragging = true;
            updateAngle(e);
        }

        function stopDragging() {
            if (isDragging && currentAngle !== -56) {
                navigateToAngle(currentAngle);
            }
            isDragging = false;
        }

        function updateAngle(e) {
            if (!isDragging && e.type !== 'click') return;

            const angle = calculateAngle(e.clientX, e.clientY);
            updateDialArm(angle);
        }

        // Touch event handlers
        function handleTouchStart(e) {
            e.preventDefault();
            isDragging = true;
            const touch = e.touches[0];
            updateAngle({
                clientX: touch.clientX,
                clientY: touch.clientY,
                type: 'touchstart'
            });
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDragging) return;
            const touch = e.touches[0];
            updateAngle({
                clientX: touch.clientX,
                clientY: touch.clientY,
                type: 'touchmove'
            });
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            if (isDragging && currentAngle !== -56) {
                navigateToAngle(currentAngle);
            }
            isDragging = false;
        }

        // Add event listeners
        dialContainer.addEventListener('mousedown', startDragging);
        document.addEventListener('mousemove', updateAngle);
        document.addEventListener('mouseup', stopDragging);

        dialContainer.addEventListener('touchstart', handleTouchStart);
        document.addEventListener('touchmove', handleTouchMove, { passive: false });
        document.addEventListener('touchend', handleTouchEnd);

        // Initialize dial position
        updateDialArm(-56);

        // Share button functionality
        const shareButton = document.getElementById('share-button');
        const copyMessage = document.getElementById('copy-message');

        function handleShare(e) {
            e.preventDefault();
            e.stopPropagation();
            const url = window.location.href;

            // Create temporary textarea
            const textarea = document.createElement('textarea');
            textarea.value = url;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);

            // Select and copy
            textarea.select();
            textarea.setSelectionRange(0, 99999); // For mobile

            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (err) {
                console.error('Copy failed:', err);
            }

            document.body.removeChild(textarea);

            if (success) {
                copyMessage.classList.add('show');
                setTimeout(() => {
                    copyMessage.classList.remove('show');
                }, 2000);
            }
        }

        shareButton.addEventListener('click', handleShare);
        shareButton.addEventListener('touchend', handleShare);
    </script>
</body>
</html>
