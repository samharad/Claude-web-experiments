<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Text-to-speech using OpenAI's TTS API">
    <title>Text to Speech</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 1rem;
            background: #f5f5f5;
            min-height: 100vh;
        }

        h1 {
            margin: 0 0 1.5rem;
            font-size: 1.5rem;
            color: #333;
        }

        .api-key-section {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .api-key-section.hidden {
            display: none;
        }

        .api-key-section p {
            margin: 0 0 0.75rem;
            font-size: 0.9rem;
            color: #856404;
        }

        .api-key-section a {
            color: #0056b3;
        }

        .api-key-input-group {
            display: flex;
            gap: 0.5rem;
        }

        .api-key-input-group input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .api-key-input-group button {
            padding: 0.5rem 1rem;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .api-key-input-group button:hover {
            background: #218838;
        }

        .key-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #d4edda;
            border: 1px solid #28a745;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #155724;
        }

        .key-status.hidden {
            display: none;
        }

        .key-status button {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.15);
        }

        .row {
            display: flex;
            gap: 1rem;
        }

        .row .form-group {
            flex: 1;
        }

        select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #007bff;
        }

        .instructions-input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
        }

        .instructions-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.15);
        }

        .instructions-input::placeholder {
            color: #999;
        }

        .hint {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 0.25rem;
        }

        .play-button {
            width: 100%;
            padding: 1rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }

        .play-button:hover:not(:disabled) {
            background: #0056b3;
        }

        .play-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .play-button.loading {
            background: #6c757d;
        }

        .actual-cost {
            margin-top: 0.75rem;
            padding: 0.6rem 1rem;
            background: #e8f4e8;
            border: 1px solid #c3e6c3;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #2d5a2d;
            text-align: center;
        }

        .actual-cost.hidden {
            display: none;
        }

        .error-display {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #721c24;
        }

        .error-display.hidden {
            display: none;
        }

        audio {
            width: 100%;
            margin-top: 1rem;
        }

        audio.hidden {
            display: none;
        }

        .char-count {
            text-align: right;
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 0.25rem;
        }

        .char-count.warning {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <h1>Text to Speech</h1>

    <div id="apiKeySection" class="api-key-section">
        <p>
            Enter your OpenAI API key to use this tool.
            <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">Get your API key here</a>
        </p>
        <div class="api-key-input-group">
            <input type="password" id="apiKeyInput" placeholder="sk-...">
            <button onclick="saveApiKey()">Save</button>
        </div>
    </div>

    <div id="keyStatus" class="key-status hidden">
        <span>API key saved</span>
        <button onclick="clearApiKey()">Clear key</button>
    </div>

    <div class="form-group">
        <label for="textInput">Text</label>
        <textarea id="textInput" placeholder="Enter text to convert to speech..."></textarea>
        <div id="charCount" class="char-count">0 characters · Est. $0.000000 ($15/1M chars)</div>
    </div>

    <div class="row">
        <div class="form-group">
            <label for="voiceSelect">Voice</label>
            <select id="voiceSelect">
                <option value="alloy">Alloy</option>
                <option value="ash">Ash</option>
                <option value="ballad">Ballad</option>
                <option value="coral">Coral</option>
                <option value="echo">Echo</option>
                <option value="fable">Fable</option>
                <option value="marin">Marin</option>
                <option value="cedar">Cedar</option>
                <option value="nova">Nova</option>
                <option value="onyx">Onyx</option>
                <option value="sage">Sage</option>
                <option value="shimmer">Shimmer</option>
                <option value="verse">Verse</option>
            </select>
        </div>

        <div class="form-group">
            <label for="modelSelect">Model</label>
            <select id="modelSelect">
                <option value="tts-1">TTS-1 (fast)</option>
                <option value="tts-1-hd">TTS-1-HD (quality)</option>
                <option value="gpt-4o-mini-tts">GPT-4o Mini TTS</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="instructionsInput">Instructions <span style="font-weight: normal; color: #6c757d;">(GPT-4o Mini TTS only)</span></label>
        <input type="text" id="instructionsInput" class="instructions-input" placeholder="e.g. Speak in a cheerful, upbeat tone">
        <div class="hint">Control tone, pace, emotion, accent, etc.</div>
    </div>

    <button id="playButton" class="play-button" onclick="generateSpeech()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
        </svg>
        Generate Speech
    </button>

    <div id="errorDisplay" class="error-display hidden"></div>

    <audio id="audioPlayer" class="hidden" controls></audio>

    <div id="actualCost" class="actual-cost hidden"></div>

    <script>
        const STORAGE_KEY = 'openai_api_key';
        const MAX_CHARS = 4096;
        let lastRequest = { model: null, charCount: 0 };

        // Pricing configuration
        const PRICING = {
            'tts-1': { type: 'chars', rate: 15 },           // $15 per 1M chars
            'tts-1-hd': { type: 'chars', rate: 30 },        // $30 per 1M chars
            'gpt-4o-mini-tts': { type: 'tokens', inputRate: 0.60, outputPerMin: 0.015 }  // $0.60/1M input tokens + ~$0.015/min audio
        };

        function init() {
            const apiKey = localStorage.getItem(STORAGE_KEY);
            updateKeyUI(!!apiKey);

            document.getElementById('textInput').addEventListener('input', updateCharCount);
            document.getElementById('modelSelect').addEventListener('change', updateCharCount);
            document.getElementById('audioPlayer').addEventListener('loadedmetadata', showActualCost);
            updateCharCount();
        }

        function showActualCost() {
            const audio = document.getElementById('audioPlayer');
            const actualCostEl = document.getElementById('actualCost');
            const duration = audio.duration;
            const { model, charCount } = lastRequest;
            const pricing = PRICING[model];

            if (!pricing || !duration) return;

            let costText;
            if (pricing.type === 'chars') {
                const cost = (charCount / 1000000) * pricing.rate;
                costText = `Est. actual cost: $${cost.toFixed(6)} (${charCount.toLocaleString()} chars, ${duration.toFixed(1)}s audio)`;
            } else {
                // Token-based: input + audio output
                const estimatedTokens = charCount / 4;
                const inputCost = (estimatedTokens / 1000000) * pricing.inputRate;
                const audioCost = (duration / 60) * pricing.outputPerMin;
                const totalCost = inputCost + audioCost;
                costText = `Est. actual cost: $${totalCost.toFixed(6)} ($${inputCost.toFixed(6)} input + $${audioCost.toFixed(6)} audio for ${duration.toFixed(1)}s)`;
            }

            actualCostEl.textContent = costText;
            actualCostEl.classList.remove('hidden');
        }

        function updateKeyUI(hasKey) {
            document.getElementById('apiKeySection').classList.toggle('hidden', hasKey);
            document.getElementById('keyStatus').classList.toggle('hidden', !hasKey);
            document.getElementById('playButton').disabled = !hasKey;
        }

        function saveApiKey() {
            const input = document.getElementById('apiKeyInput');
            const key = input.value.trim();
            if (key) {
                localStorage.setItem(STORAGE_KEY, key);
                input.value = '';
                updateKeyUI(true);
            }
        }

        function clearApiKey() {
            localStorage.removeItem(STORAGE_KEY);
            updateKeyUI(false);
            hideError();
            document.getElementById('audioPlayer').classList.add('hidden');
            document.getElementById('actualCost').classList.add('hidden');
        }

        function updateCharCount() {
            const text = document.getElementById('textInput').value;
            const count = text.length;
            const model = document.getElementById('modelSelect').value;
            const { label } = calculateCost(count, model);
            const countEl = document.getElementById('charCount');
            countEl.textContent = `${count.toLocaleString()} character${count !== 1 ? 's' : ''} · Est. ${label}`;
            countEl.classList.toggle('warning', count > MAX_CHARS);
        }

        function showError(message) {
            const el = document.getElementById('errorDisplay');
            el.textContent = message;
            el.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorDisplay').classList.add('hidden');
        }

        function calculateCost(charCount, model) {
            const pricing = PRICING[model];
            if (!pricing) return { cost: 0, label: '' };

            if (pricing.type === 'chars') {
                const cost = (charCount / 1000000) * pricing.rate;
                return { cost, label: `$${cost.toFixed(6)} ($${pricing.rate}/1M chars)` };
            } else {
                // Token-based: estimate ~4 chars per token
                const estimatedTokens = charCount / 4;
                const inputCost = (estimatedTokens / 1000000) * pricing.inputRate;
                return {
                    cost: inputCost,
                    label: `~$${inputCost.toFixed(6)} input + audio (~$0.015/min)`
                };
            }
        }

        async function generateSpeech() {
            const apiKey = localStorage.getItem(STORAGE_KEY);
            if (!apiKey) {
                showError('Please enter your API key first.');
                return;
            }

            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                showError('Please enter some text.');
                return;
            }

            if (text.length > MAX_CHARS) {
                showError(`Text exceeds maximum length of ${MAX_CHARS.toLocaleString()} characters.`);
                return;
            }

            const voice = document.getElementById('voiceSelect').value;
            const model = document.getElementById('modelSelect').value;
            const instructions = document.getElementById('instructionsInput').value.trim();

            const button = document.getElementById('playButton');
            const audioPlayer = document.getElementById('audioPlayer');
            const actualCostEl = document.getElementById('actualCost');

            lastRequest = { model, charCount: text.length };
            hideError();
            actualCostEl.classList.add('hidden');
            button.disabled = true;
            button.classList.add('loading');
            button.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="animation: spin 1s linear infinite;">
                    <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" opacity="0.3"/>
                    <path d="M12 2v4a8 8 0 0 1 8 8h4a12 12 0 0 0-12-12z"/>
                </svg>
                Generating...
            `;

            try {
                const response = await fetch('https://api.openai.com/v1/audio/speech', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: model,
                        input: text,
                        voice: voice,
                        response_format: 'mp3',
                        ...(instructions && { instructions })
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `API error: ${response.status}`);
                }

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);

                // Revoke previous URL if exists
                if (audioPlayer.src && audioPlayer.src.startsWith('blob:')) {
                    URL.revokeObjectURL(audioPlayer.src);
                }

                audioPlayer.src = audioUrl;
                audioPlayer.classList.remove('hidden');
                audioPlayer.play();

            } catch (error) {
                showError(error.message);
                audioPlayer.classList.add('hidden');
                actualCostEl.classList.add('hidden');
            } finally {
                button.disabled = false;
                button.classList.remove('loading');
                button.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    Generate Speech
                `;
            }
        }

        // Add spin animation
        const style = document.createElement('style');
        style.textContent = '@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
        document.head.appendChild(style);

        init();
    </script>
</body>
</html>
