<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shows how long baby Arthur has been alive, in days and weeks plus days">
    <title>Arthur's Age</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(160deg, #fdf6ec 0%, #eaf4f4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            color: #445;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(80, 100, 120, 0.12);
            padding: 2.5rem 2.5rem 2rem;
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .emoji {
            font-size: 2.5rem;
            line-height: 1;
        }

        h1 {
            margin: 0.6rem 0 0.2rem;
            font-size: 1.35rem;
            font-weight: 600;
            color: #334;
        }

        .born {
            font-size: 0.82rem;
            color: #99a;
            margin: 0 0 1.8rem;
        }

        .age-block {
            margin-bottom: 1.6rem;
        }

        .age-value {
            font-size: 2.6rem;
            font-weight: 700;
            color: #2c6e8a;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .age-value .unit {
            font-size: 1.1rem;
            font-weight: 500;
            color: #7a9aa8;
            margin-left: 0.15rem;
        }

        .age-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #aab;
            margin-top: 0.35rem;
        }

        .divider {
            border: none;
            border-top: 1px solid #eef1f3;
            margin: 1.6rem 0;
        }

        .precise {
            font-size: 0.85rem;
            color: #8a97a3;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">👶</div>
        <h1>Arthur has been alive for</h1>
        <p class="born">Born July 26, 2026 at 8:48&nbsp;AM Pacific</p>

        <div class="age-block">
            <div class="age-value" id="days"></div>
            <div class="age-label">days</div>
        </div>

        <div class="age-block">
            <div class="age-value" id="weeks-days"></div>
            <div class="age-label">weeks + days</div>
        </div>

        <hr class="divider">
        <div class="precise" id="precise"></div>
    </div>

    <script>
        // 8:48 AM Pacific on 2026-07-26 is PDT (UTC-7)
        const BIRTH = new Date('2026-07-26T08:48:00-07:00');
        const MS_PER_DAY = 24 * 60 * 60 * 1000;

        function pluralize(n, word) {
            return n + ' ' + word + (n === 1 ? '' : 's');
        }

        function update() {
            const now = new Date();
            const elapsedMs = now - BIRTH;

            const totalDays = Math.floor(elapsedMs / MS_PER_DAY);
            const weeks = Math.floor(totalDays / 7);
            const remDays = totalDays % 7;

            document.getElementById('days').textContent = totalDays.toLocaleString();

            document.getElementById('weeks-days').textContent =
                pluralize(weeks, 'week') + ', ' + pluralize(remDays, 'day');

            const totalSeconds = Math.floor(elapsedMs / 1000);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            document.getElementById('precise').textContent =
                'and ' + hours + 'h ' + minutes + 'm ' + seconds + 's into day ' + (totalDays + 1);

            document.title = 'Arthur’s Age — ' + pluralize(totalDays, 'day');
        }

        update();
        setInterval(update, 1000);
    </script>
</body>
</html>
